<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="NovaBot">
  <rect width="180" height="180" rx="40" fill="#000000"/>

  <!-- Nova burst (top) — star energy -->
  <g fill="#ffffff" transform="translate(90 48)">
    <polygon points="0,-22 3.5,-6 20,-6 6.5,2 11,18 0,8 -11,18 -6.5,2 -20,-6 -3.5,-6"/>
    <circle cx="0" cy="0" r="4.5"/>
  </g>

  <!-- Antenna stem connecting nova to bot -->
  <line x1="90" y1="68" x2="90" y2="82" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bot head -->
  <rect x="48" y="82" width="84" height="58" rx="16" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="70" cy="106" r="6" fill="#ffffff"/>
  <circle cx="110" cy="106" r="6" fill="#ffffff"/>

  <!-- Mouth -->
  <rect x="78" y="122" width="24" height="5" rx="2.5" fill="#ffffff"/>

  <!-- Side sensors -->
  <line x1="48" y1="104" x2="36" y2="104" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="104" x2="144" y2="104" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
